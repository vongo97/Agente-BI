# ══════════════════════════════════════════════════════════════════
# Vektra BI — Nginx (producción con TLS)
#
# PASO 1 (una sola vez en el VPS) — obtener certificado gratis:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d agbi.duckdns.org
# Certbot reescribirá los certificados y activará HTTPS automáticamente.
# ══════════════════════════════════════════════════════════════════

# Rate limiting: 10 peticiones/seg por IP en el API (protección anti-abuso
# complementaria al slowapi de FastAPI, que es por usuario).
limit_req_zone $binary_remote_addr zone=vektra_api:10m rate=10r/s;

# Redirección HTTP → HTTPS
server {
    listen 80;
    server_name agbi.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name agbi.duckdns.org;

    # ── TLS (rutas gestionadas por certbot) ──
    ssl_certificate     /etc/letsencrypt/live/agbi.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agbi.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Security headers ──
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Límite de body alineado con el límite de uploads del backend (25MB)
    client_max_body_size 26m;

    # Frontend (Next.js)
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Backend (FastAPI) con rate limit por IP
    location /api/ {
        limit_req zone=vektra_api burst=30 nodelay;
        proxy_pass http://localhost:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
