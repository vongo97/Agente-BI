services:
  - type: web
    # IMPORTANTE: el nombre debe coincidir EXACTAMENTE con el servicio que ya existe
    # en Render (incluido el sufijo que Render anadio al crearlo). Si aqui pone
    # "agente-bi-server", el Blueprint no encuentra nada que actualizar y crea otro
    # servicio duplicado con un sufijo nuevo, dejando la app apuntando al host viejo.
    # Este nombre es legado (SQLite no persistente). El backend canónico es
    # agente-bi-server-7nav-zifr; no renombrar aquí sin comprobar el Blueprint.
    name: agente-bi-server-7nav
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    rootDir: server
    plan: free
    # /live no consulta DB ni almacenamiento: evita reinicios por un health
    # check lento mientras el análisis (LLM/pandas) sigue en curso.
    healthCheckPath: /live
    envVars:
      - key: DATABASE_URL
        sync: false # Configurar en el Dashboard de Render con la URL de Supabase
      - key: PORT
        value: 8000
      - key: AUTHORIZED_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      # ── Seguridad: obligatorio en producción ──────────────────────────────────
      # ENVIRONMENT: garantiza que el bypass de desarrollo nunca se active en Render
      # aunque RENDER no esté seteado en deployments alternativos.
      - key: ENVIRONMENT
        value: production
      # Fase 2 de P-54: activa el enrutamiento de auditoría a hechos verificados.
      - key: AUDIT_AGENT_ENABLED
        value: "true"
      # Presupuesto del narrador LLM de auditoría. Al agotarse, se usa la
      # narrativa determinista (con las mismas cifras verificadas).
      - key: AUDIT_NARRATOR_TIMEOUT_S
        value: "25"
      # CORS explícito: orígenes permitidos (separados por coma). Incluir el
      # dominio real del frontend desplegado, si no el navegador bloquea con
      # "Failed to fetch" aunque el backend esté vivo.
      - key: ALLOWED_ORIGINS
        value: https://agente-bi-client-5nx4.onrender.com,https://agente-bi-client.onrender.com,https://agente-bi.onrender.com,https://agente-bi.vercel.app,https://vektra-bi-eight.vercel.app
      # AUTH_SECRET: firma JWT. Configurar en el Dashboard de Render con un secreto
      # aleatorio seguro (mínimo 32 chars). Ej: openssl rand -hex 32
      - key: AUTH_SECRET
        sync: false  # NO poner el valor aquí; configurarlo en el Dashboard de Render

  # 3. Frontend (Next.js)
  # NOTA: si Render ya creo este servicio con sufijo (agente-bi-client-5nx4),
  # el nombre del yaml NO debe cambiar o Render creara otro servicio distinto.
  - type: web
    # Mismo criterio que el backend: nombre real con sufijo incluido.
    name: agente-bi-client-5nx4
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    rootDir: client
    plan: free
    envVars:
      # URL completa del backend. NOTA: fromService (property: host) inyecta solo
      # el nombre del servicio ("agente-bi-server") sin esquema ni dominio, lo que
      # rompe las llamadas API (ruta relativa -> 404). Se usa la URL literal.
      # Backend canónico en producción: Postgres persistente (-zifr).
      # No usar -7nav (SQLite no persistente) para datos reales.
      - key: NEXT_PUBLIC_API_URL
        value: https://agente-bi-server-7nav-zifr.onrender.com
      - key: NEXTAUTH_SECRET
        sync: false
      # NEXTAUTH_URL debe ser la URL publica EXACTA del frontend. fromService
      # (property: host) devuelve solo el nombre del servicio, y ademas Render
      # anade sufijo aleatorio si el nombre "agente-bi-client" ya esta ocupado
      # (host real: agente-bi-client-5nx4.onrender.com). Con un valor invalido,
      # NextAuth responde 500 en /api/auth/error.
      - key: NEXTAUTH_URL
        value: https://agente-bi-client-5nx4.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
