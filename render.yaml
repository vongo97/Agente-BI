services:
  - type: web
    name: agente-bi-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    rootDir: server
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # Configurar en el Dashboard de Render con la URL de Supabase
      - key: PORT
        value: 8000
      - key: AUTHORIZED_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      # ── Seguridad: obligatorio en producción ──────────────────────────────────
      # ENVIRONMENT: garantiza que el bypass de desarrollo nunca se active en Render
      # aunque RENDER no esté seteado en deployments alternativos.
      - key: ENVIRONMENT
        value: production
      # CORS explícito: orígenes permitidos (separados por coma). Incluir el
      # dominio real del frontend desplegado, si no el navegador bloquea con
      # "Failed to fetch" aunque el backend esté vivo.
      - key: ALLOWED_ORIGINS
        value: https://agente-bi-client-5nx4.onrender.com,https://agente-bi-client.onrender.com,https://agente-bi.onrender.com,https://agente-bi.vercel.app,https://vektra-bi-eight.vercel.app
      # AUTH_SECRET: firma JWT. Configurar en el Dashboard de Render con un secreto
      # aleatorio seguro (mínimo 32 chars). Ej: openssl rand -hex 32
      - key: AUTH_SECRET
        sync: false  # NO poner el valor aquí; configurarlo en el Dashboard de Render

  # 3. Frontend (Next.js)
  # NOTA: si Render ya creo este servicio con sufijo (agente-bi-client-5nx4),
  # el nombre del yaml NO debe cambiar o Render creara otro servicio distinto.
  - type: web
    name: agente-bi-client
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    rootDir: client
    plan: free
    envVars:
      # URL completa del backend. NOTA: fromService (property: host) inyecta solo
      # el nombre del servicio ("agente-bi-server") sin esquema ni dominio, lo que
      # rompe las llamadas API (ruta relativa -> 404). Se usa la URL literal.
      - key: NEXT_PUBLIC_API_URL
        value: https://agente-bi-server-ci55.onrender.com
      - key: NEXTAUTH_SECRET
        sync: false
      # NEXTAUTH_URL debe ser la URL publica EXACTA del frontend. fromService
      # (property: host) devuelve solo el nombre del servicio, y ademas Render
      # anade sufijo aleatorio si el nombre "agente-bi-client" ya esta ocupado
      # (host real: agente-bi-client-5nx4.onrender.com). Con un valor invalido,
      # NextAuth responde 500 en /api/auth/error.
      - key: NEXTAUTH_URL
        value: https://agente-bi-client-5nx4.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
