databases:
  - name: agente-bi-db
    plan: free # Puedes cambiarlo a starter para producción

services:
  - type: web
    name: agente-bi-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    rootDir: server
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agente-bi-db
          property: connectionString
      - key: PORT
        value: 8000
      - key: AUTHORIZED_EMAILS
        sync: false # Configurar en el Dashboard de Render para restringir acceso
      - key: GEMINI_API_KEY
        sync: false # Configurar en el Dashboard de Render

  # 3. Frontend (Next.js)
  - type: web
    name: agente-bi-client
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    rootDir: client
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: agente-bi-server
          type: web
          property: host
      - key: NEXTAUTH_SECRET
        sync: false # Generar uno en el Dashboard (openssl rand -base64 32)
      - key: NEXTAUTH_URL
        fromService:
          name: agente-bi-client
          type: web
          property: host
