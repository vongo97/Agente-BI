services:
  - type: web
    name: agente-bi-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    rootDir: server
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # Configurar en el Dashboard de Render con la URL de Supabase
      - key: PORT
        value: 8000
      - key: AUTHORIZED_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

  # 3. Frontend (Next.js)
  - type: web
    name: agente-bi-client
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    rootDir: client
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: agente-bi-server
          type: web
          property: host
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        fromService:
          name: agente-bi-client
          type: web
          property: host
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
