name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + compileall)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile sources (P-60 rule)
        run: python -m compileall src -q

      - name: Run tests
        env:
          ENVIRONMENT: development
          RENDER: "false"
          AUTH_SECRET: ci-secret-not-used-for-real-auth
        run: python -m pytest tests -q

  client:
    name: Client (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        # esbuild está aprobado vía `allowScripts` en package.json
        # (npm install-scripts approve esbuild), necesario para su binario.
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build
